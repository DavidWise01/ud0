<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE I-13 WORLD · SONNY 5</title>
<style>
html,body{margin:0;height:100%;background:#0c0614;overflow:hidden;}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#0c0614;}
.hit{position:fixed;top:0;bottom:0;width:24%;border:0;background:transparent;cursor:pointer;z-index:2;}
#prev{left:0;}
#next{right:0;}
.n{position:fixed;z-index:3;bottom:12px;left:0;right:0;text-align:center;color:rgba(244,239,228,.8);font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;pointer-events:none;text-shadow:0 1px 6px #000;}
a.back{position:fixed;z-index:3;top:12px;left:14px;color:#f4efe4;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-decoration:none;text-shadow:0 1px 6px #000;}
.fail{display:none;position:fixed;z-index:5;left:12px;right:12px;top:12px;background:#ff6b8a;color:#1b0730;padding:10px 12px;font:700 14px ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="fail" id="failb"></div>
<a class="back" href="./">WORLD V</a>
<img id="plate" src="art/diatom.jpg" alt="Square diatom over a green star">
<button class="hit" id="prev" aria-label="previous artwork"></button>
<button class="hit" id="next" aria-label="next artwork"></button>
<div class="n" id="n">1 / 19</div>
<script>
"use strict";
(function(){
  function $(id){return document.getElementById(id);}
  try{
    var VERBS=[
      {sym:"Name",n:2967,plane:"DESIGNATE"},{sym:"Constant",n:1425,plane:"DESIGNATE"},{sym:"Attribute",n:963,plane:"DESIGNATE"},
      {sym:"Assign",n:523,plane:"BIND"},{sym:"Arg",n:408,plane:"BIND"},{sym:"Return",n:182,plane:"BIND"},
      {sym:"Expr",n:301,plane:"DECIDE"},{sym:"If",n:276,plane:"DECIDE"},{sym:"Compare",n:201,plane:"DECIDE"},
      {sym:"Call",n:750,plane:"TRANSFORM"},{sym:"FunctionDef",n:192,plane:"TRANSFORM"},{sym:"BinOp",n:138,plane:"TRANSFORM"}
    ];
    var PLATES=[
      ["art/diatom.jpg","Square diatom over a green star"],
      ["art/waterbear.jpg","Waterbear in a toroidal ring"],
      ["art/lillith.jpg","Lillith with a diatom and a waterbear"],
      ["art/hekate.jpg","Three-faced figure of fire over a mountain"],
      ["art/hadal.jpg","A vast eye above bioluminescent ruins"],
      ["art/plasma.jpg","A plasma well inside a steel ring"],
      ["art/prism.jpg","A glass prism throwing light under a bridge"],
      ["art/cubit.jpg","Three faces grown into one cubit"],
      ["art/universe-k.jpg","Universe of K, lantern and green well"],
      ["art/house-k.jpg","House K heraldic woodcut"],
      ["art/seal.jpg","A wax seal around a river and a machine"],
      ["art/patricia.jpg","Patricia in a cosmic devotional"],
      ["art/resonance.jpg","Patricia in resonance"],
      ["art/jane.jpg","Jane, a cosmic portrait"],
      ["art/amoeba.jpg","A glowing cell"],
      ["art/string.jpg","A glowing string"],
      ["art/octahedron.jpg","A neon octahedron inside a gold cube"],
      ["art/ada.jpg","A drawn portrait of Ada"],
      ["art/lesbos.jpg","A lyre player at the shore"]
    ];
    function sumCounts(){var s=0,i;for(i=0;i<VERBS.length;i++)s+=VERBS[i].n;return s;}
    function plane(name){var s=0,i;for(i=0;i<VERBS.length;i++)if(VERBS[i].plane===name)s+=VERBS[i].n;return s;}
    function powers(){var p=[],x=1,i;for(i=0;i<5;i++){p.push(x);x=x*3;}return p;}
    function nsCount(s){var n=0,i,c;for(i=0;i<s.length;i++){c=s.charAt(i);if(c==="g"||c==="u"||c==="p"||c==="q")n++;}return n;}
    function selfcheck(){
      if(VERBS.length!==12)throw new Error("twelve");
      if(plane("DESIGNATE")!==5355||plane("BIND")!==1113||plane("DECIDE")!==778||plane("TRANSFORM")!==1080)throw new Error("plane");
      if(sumCounts()!==8326)throw new Error("grand");
      if((sumCounts()/100).toFixed(2)!=="83.26")throw new Error("pct");
      if(powers().join(",")!=="1,3,9,27,81")throw new Error("trit");
      if(nsCount("[g[u[p[(o)]]]]")!==3||nsCount("[g[u[p[q[(o)]]]]]")!==4)throw new Error("nest");
      if(PLATES.length!==19)throw new Error("plates");
      if(PLATES[0][0]!=="art/diatom.jpg")throw new Error("opener");
    }
    var at=0;
    function show(){
      var p=PLATES[at];
      var img=$("plate");
      img.src=p[0];
      img.alt=p[1];
      $("n").textContent=(at+1)+" / "+PLATES.length;
      var nxt=new Image();
      nxt.src=PLATES[(at+1)%PLATES.length][0];
    }
    function step(d){at=(at+d+PLATES.length)%PLATES.length;show();}
    selfcheck();
    show();
    $("next").onclick=function(){step(1);};
    $("prev").onclick=function(){step(-1);};
    window.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")step(1);
      else if(e.key==="ArrowLeft")step(-1);
    });
  }catch(e){
    var fb=$("failb");
    if(fb){fb.style.display="block";fb.textContent="FAIL-LOUD — "+(e&&e.message?e.message:e);}
    throw e;
  }
})();
</script>
</body>
</html>
