<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Plane Press — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#7c2d12;color:#fff7ed;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#fff7ed;color:#431407;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px;} .bin{border:2px solid currentColor;padding:8px;min-height:72px;} .bin b{font-family:ui-monospace,Consolas,monospace;font-size:12px;}
</style>
</head>
<body data-kind="sonny-plane-press">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-twelve.html">the measured room</a></p>
<h1>The Plane Press</h1>
<p class="lede">Choose a verb, then a plane. The canon filing is checked on load. You can mis-file Call and watch the sum break.</p>
<div id="stage"><div class="stamps"><b>LIT filing</b><b>AMBER counts</b></div><div class="row"><button data-act="verb" data-arg="Name">Name</button><button data-act="verb" data-arg="Constant">Constant</button><button data-act="verb" data-arg="Attribute">Attribute</button><button data-act="verb" data-arg="Assign">Assign</button><button data-act="verb" data-arg="Arg">Arg</button><button data-act="verb" data-arg="Return">Return</button><button data-act="verb" data-arg="Expr">Expr</button><button data-act="verb" data-arg="If">If</button><button data-act="verb" data-arg="Compare">Compare</button><button data-act="verb" data-arg="Call">Call</button><button data-act="verb" data-arg="FunctionDef">FunctionDef</button><button data-act="verb" data-arg="BinOp">BinOp</button></div><div class="row" style="margin-top:8px"><button data-act="plane" data-arg="I DESIGNATE">I DESIGNATE</button><button data-act="plane" data-arg="II BIND">II BIND</button><button data-act="plane" data-arg="III DECIDE">III DECIDE</button><button data-act="plane" data-arg="IV TRANSFORM">IV TRANSFORM</button></div><div id="planes"></div><div class="row" style="margin-top:8px"><button data-act="canon">File the canon</button><button data-act="mis">Mis-file Call</button><button data-act="clear">Clear</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=220;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var CENSUS=[["Name",2967,"I DESIGNATE"],["Constant",1425,"I DESIGNATE"],["Attribute",963,"I DESIGNATE"],["Assign",523,"II BIND"],["Arg",408,"II BIND"],["Return",182,"II BIND"],["Expr",301,"III DECIDE"],["If",276,"III DECIDE"],["Compare",201,"III DECIDE"],["Call",750,"IV TRANSFORM"],["FunctionDef",192,"IV TRANSFORM"],["BinOp",138,"IV TRANSFORM"]];
var SUBS={"I DESIGNATE":5355,"II BIND":1113,"III DECIDE":778,"IV TRANSFORM":1080};
var PLANES=["I DESIGNATE","II BIND","III DECIDE","IV TRANSFORM"];
var filing={}, picked=null;
function score(f){
  var out={ok:true, parts:{}};
  PLANES.forEach(function(p){
    var s=0; CENSUS.forEach(function(r){ if(f[r[0]]===p) s+=r[1]; });
    out.parts[p]=s; if(s!==SUBS[p]) out.ok=false;
  });
  return out;
}
function draw(){
  var html="";
  PLANES.forEach(function(p){
    var names=[]; CENSUS.forEach(function(r){ if(filing[r[0]]===p) names.push(r[0]); });
    html+='<div class="bin"><b>'+p+'</b><div>'+names.join(" ")+'</div></div>';
  });
  document.getElementById("planes").innerHTML=html;
  var sc=score(filing);
  var n=Object.keys(filing).length;
  document.getElementById("note").textContent = n<12 ? (picked||"Pick a verb") : (sc.ok ? "Witness green. Every plane matches." : "Witness red. A plane sum moved.");
}
function onAct(act, arg){
  if(act==="verb") picked=arg;
  if(act==="plane" && picked){ filing[picked]=arg; picked=null; }
  if(act==="canon"){ filing={}; CENSUS.forEach(function(r){ filing[r[0]]=r[2]; }); }
  if(act==="mis"){ onAct("canon"); filing.Call="I DESIGNATE"; }
  if(act==="clear") filing={};
  draw();
}
function prove(){
  var good={}; CENSUS.forEach(function(r){ good[r[0]]=r[2]; });
  if(!score(good).ok) throw new Error("canon");
  var bad={}; CENSUS.forEach(function(r){ bad[r[0]]=r[2]; }); bad.Call="I DESIGNATE";
  var b=score(bad);
  if(b.ok) throw new Error("misfile should break");
  if(b.parts["I DESIGNATE"]!==6105) throw new Error("designate");
  if(b.parts["IV TRANSFORM"]!==330) throw new Error("transform");
  document.getElementById("proof").textContent="LIT canon planes match. Mis-filing Call makes designate 6105 and transform 330.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Plane Press";
var SLUG="sonny-plane-press";
var BLURB="A press that files the twelve verbs onto four planes. The canon sums hold. Moving Call onto designate breaks them.";
var SEAL="9f01789ad7d5280631da7904dc0fddc415ad61b13cc7d44356e2d2f81afd80ea";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
