<body data-kind="sonny-keyword-i">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-twelve.html">the measured room</a></p>
<h1>The Keyword I</h1>
<p class="lede">Build the line I x <- 0. A line with no I is refused. WALL: this page did not run the compiler.</p>
<div id="stage"><div class="stamps"><b>LIT toy</b><b>WALL compiler</b></div><div id="line"></div><div class="row"><button data-act="I">I</button><button data-act="x">x</button><button data-act="bind">&lt;-</button><button data-act="zero">0</button><button data-act="bad">Drop the I</button><button data-act="clear">Clear</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine";
  o.frequency.value=392;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var line="";
function declares(s){ return /^I [a-z]+ <- -?\d+$/.test(s); }
function draw(){
  document.getElementById("line").textContent=line||" ";
  document.getElementById("note").textContent = line ? (declares(line) ? "Accepted as a toy declaration." : "Refused.") : "Empty.";
}
function onAct(act){
  if(act==="I") line=(line+" I").trim();
  if(act==="x") line=(line+" x").trim();
  if(act==="bind") line=(line+" <-").trim();
  if(act==="zero") line=(line+" 0").trim();
  if(act==="bad") line="x <- 0";
  if(act==="clear") line="";
  draw();
}
function prove(){
  if(!declares("I x <- 0")) throw new Error("accept");
  if(declares("x <- 0")) throw new Error("refuse");
  if(declares("I <- 0")) throw new Error("name");
  document.getElementById("proof").textContent="LIT toy accepts I x <- 0 and refuses x <- 0. WALL the compiler was not run.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Keyword I";
var SLUG="sonny-keyword-i";
var BLURB="A toy line. A declaration starts with the keyword I. The I-13 compiler is not run on this page.";
var SEAL="2ec71fd945fbd22785d4f41f26e93f43d67cc0e8da8b4eb282b58531b2a7672b";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
