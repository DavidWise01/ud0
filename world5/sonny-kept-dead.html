<body data-kind="sonny-kept-dead">

<h1>The Kept Dead</h1>
<p class="lede">The delete control is live and it refuses. A retracted sentence stays struck through, on the page.</p>
<div id="stage"><div class="stamps"><b>DEAD claims kept</b></div><div id="tablets"></div><button data-act="del">Try to delete them</button></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.value=90;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var LINES=["The alphabet was designed.","83.26 percent of all Python code."];
var kept=LINES.slice();
function refuse(){ return false; }
function draw(){ document.getElementById("tablets").innerHTML=kept.map(function(s){return '<div class="tablet"><s>'+s+'</s></div>';}).join(""); }
function onAct(){
  var ok=refuse();
  if(!ok) document.getElementById("note").textContent="Delete refused. Both sentences stay.";
  draw();
}
function prove(){
  if(refuse()!==false) throw new Error("erase");
  if(kept[0]!==LINES[0] || kept[1]!==LINES[1]) throw new Error("lost");
  document.getElementById("proof").textContent="LIT the delete control refuses. Both retracted sentences remain.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Kept Dead";
var SLUG="sonny-kept-dead";
var BLURB="Two retracted sentences stay visible. The alphabet was counted, and 83.26 is not a claim about all Python. A delete control refuses to erase them.";
var SEAL="1cf104b13dbb630aaf80fdc613f90b6856a6982c4b4fee09bc6f8e55c3066e8d";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
