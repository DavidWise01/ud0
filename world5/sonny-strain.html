<body data-kind="sonny-strain">

<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-palindrome.html">the measured room</a></p>
<h1>The Strain</h1>
<p class="lede">The beam is tipped on purpose. The decades are computed here from 2049 against 1 and 2048 against 48.</p>
<div id="stage"><div class="stamps"><b>LIT decades</b><b>AMBER masses</b></div><div id="beam"></div><div id="ful"></div><p>W1 against W5: <b id="d1"></b> decades. W2 against W4: <b id="d2"></b> decades.</p><p>Tower deficit on the cited young masses: <b id="def"></b>.</p></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

function decades(a,b){ return Math.log10(a/b); }
function deficit(){ return (2048-48)+(2048-1); }
function prove(){
  var d1=decades(2049,1), d2=decades(2048,48);
  if(!(d1>3.3 && d1<3.32)) throw new Error("d1");
  if(!(d2>1.62 && d2<1.64)) throw new Error("d2");
  if(deficit()!==4047) throw new Error("deficit");
  if(2049===1 || 2048===48) throw new Error("symmetry");
  document.getElementById("d1").textContent=d1.toFixed(2);
  document.getElementById("d2").textContent=d2.toFixed(2);
  document.getElementById("def").textContent="4047";
  document.getElementById("proof").textContent="LIT strains "+d1.toFixed(2)+" and "+d2.toFixed(2)+" decades. Deficit 4047. Mass symmetry on the cited masses is false.";
}
prove();
var tilt=decades(2049,1);
document.getElementById("beam").style.transform="rotate("+(tilt*1.5).toFixed(2)+"deg)";


var NAME="The Strain";
var SLUG="sonny-strain";
var BLURB="A tipped beam. From the cited masses the page computes the two decade strains and the tower deficit 4047. Mass symmetry on those masses is false.";
var SEAL="e3edb086e7775b25628534dffa04713642be0e1a1d507b037ec2dfec04920bb2";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
