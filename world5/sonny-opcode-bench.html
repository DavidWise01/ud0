<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Opcode Bench — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#083344;color:#ecfeff;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#fff7ed;color:#431407;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#tape{font-family:ui-monospace,Consolas,monospace;font-size:18px;margin:8px 0;} #stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:80px;margin-top:8px;} .box{background:#22d3ee;color:#083344;padding:6px 10px;width:88px;text-align:center;font-family:ui-monospace,Consolas,monospace;}
</style>
</head>
<body data-kind="sonny-opcode-bench">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-conservation-law.html">the measured room</a></p>
<h1>The Opcode Bench</h1>
<p class="lede">The arith tape is loaded: Const, Const, Bin, Answer. Height ends at 0. Add a Drop and it does not.</p>
<div id="stage"><div class="stamps"><b>LIT stack</b></div><div id="tape"></div><div id="stack"></div><div class="row"><button data-act="add" data-arg="Const">Const</button><button data-act="add" data-arg="Ask">Ask</button><button data-act="add" data-arg="Attr">Attr</button><button data-act="add" data-arg="Ret">Ret</button><button data-act="add" data-arg="Answer">Answer</button><button data-act="add" data-arg="Drop">Drop</button><button data-act="add" data-arg="Bin">Bin</button><button data-act="add" data-arg="Cmp">Cmp</button><button data-act="add" data-arg="If">If</button><button data-act="add" data-arg="Block">Block</button><button data-act="add" data-arg="Else">Else</button><button data-act="add" data-arg="End">End</button><button data-act="add" data-arg="Func">Func</button><button data-act="add" data-arg="Halt">Halt</button></div><div class="row" style="margin-top:8px"><button data-act="drop">Add Drop</button><button data-act="reset">Reset arith</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=196;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var OPS={"Const":[0,1],"Ask":[0,1],"Attr":[1,1],"Ret":[1,1],"Answer":[1,0],"Drop":[1,0],"Bin":[2,1],"Cmp":[2,1],"If":[1,0],"Block":[0,0],"Else":[0,0],"End":[0,0],"Func":[0,0],"Halt":[0,0]};
var ORDER=["Const","Ask","Attr","Ret","Answer","Drop","Bin","Cmp","If","Block","Else","End","Func","Halt"];
var NET={"Const":1,"Ask":1,"Attr":0,"Ret":0,"Answer":-1,"Drop":-1,"Bin":-1,"Cmp":-1,"If":-1,"Block":0,"Else":0,"End":0,"Func":0,"Halt":0};

function opNet(op){ var t=OPS[op]; return t[1]-t[0]; }
function callNet(n, tamper){ return 1 - (tamper ? n : n+1); }
function run(code, tamper){
  var h=0, slots=0, ctrl=[], ok=true, reason="";
  for(var i=0;i<code.length;i++){
    slots++;
    var ins=code[i];
    var k = ins.op==="Call" ? (tamper?ins.n:ins.n+1) : OPS[ins.op][0];
    var net = ins.op==="Call" ? callNet(ins.n, tamper) : opNet(ins.op);
    if(h-k<0){ ok=false; if(!reason) reason="underflow"; }
    if(ins.op==="Block") ctrl.push(h);
    else if(ins.op==="End"){ if(!ctrl.length){ ok=false; reason=reason||"no region"; } else ctrl.pop(); }
    h+=net;
  }
  if(ctrl.length){ ok=false; reason=reason||"unclosed"; }
  var valid=ok && h===0;
  return {valid:valid, height:h, slots:slots, reason:valid?"balanced":(reason||("height "+h))};
}

var tape=[{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"}];
function draw(){
  document.getElementById("tape").textContent=tape.map(function(t){return t.op;}).join("  ");
  var h=0, html="";
  tape.forEach(function(ins){ h+=opNet(ins.op); });
  for(var i=0;i<Math.max(0,h);i++) html+='<div class="box"> </div>';
  document.getElementById("stack").innerHTML=html||'<div class="box">empty</div>';
  var r=run(tape,false);
  document.getElementById("note").textContent=(r.valid?"VALID":"INVALID")+" · height "+r.height+" · "+r.reason;
}
function onAct(act, arg){
  if(act==="add") tape.push({op:arg});
  if(act==="reset") tape=[{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"}];
  if(act==="drop") tape.push({op:"Drop"});
  draw();
}
function prove(){
  ORDER.forEach(function(op){ if(opNet(op)!==NET[op]) throw new Error(op); });
  var samples=[
    [[{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"}], true],
    [[{op:"Const"},{op:"Const"},{op:"Cmp"},{op:"If"},{op:"Block"},{op:"Const"},{op:"Answer"},{op:"End"}], true],
    [[{op:"Const"},{op:"Const"},{op:"Const"},{op:"Call",n:2},{op:"Answer"}], true],
    [[{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"},{op:"Drop"}], false],
    [[{op:"Const"},{op:"Bin"}], false]
  ];
  samples.forEach(function(s){ var r=run(s[0], false); if(r.valid!==s[1]) throw new Error(r.reason); if(r.slots!==s[0].length) throw new Error("slots"); });
  document.getElementById("proof").textContent="LIT 14 opcode nets and 5 sample tapes. Three balance, two do not.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Opcode Bench";
var SLUG="sonny-opcode-bench";
var BLURB="A bench for the fourteen fixed opcodes. Stack height moves by binds minus k. Three sample programs balance and two do not.";
var SEAL="3995ab2db6ffa2ef9339a69d743169cddd1cbe172977d9f32809a916452542b1";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
