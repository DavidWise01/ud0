<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE PRE POST — a dart · SONNY 5</title>
<style>:root{--line:rgba(62,240,255,.28);--ink:#cfe9ff;--dim:#6f8ba8;--cyan:#3ef0ff;--orange:#ff8a3d;--gold:#d9b45a;--good:#59ffb0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1020;color:var(--ink);max-width:900px;margin:auto;padding:20px}a{color:var(--cyan)}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}.dart{color:var(--orange);border:1px solid var(--orange);padding:2px 8px}h1{letter-spacing:2px;margin:16px 0}.panel{border:1px solid var(--line);padding:14px;margin:14px 0}input,button{background:#102030;color:var(--gold);border:1px solid var(--line);padding:7px 11px}button{color:var(--cyan);cursor:pointer}.out{margin-top:8px;color:var(--good)}</style></head>
<body><div class="top"><a href="./">◄ WHETSTONE BAY</a><span class="dart">WHET 11 / 42</span></div>
<h1>THE PRE POST</h1>
<p style="color:var(--dim)">Body must sit between a fixed prefix and suffix.</p>
<div class="panel">pre <input id="pre" value="[["> body <input id="body" value="ok"> post <input id="post" value="]]"> <button id="go">WRAP</button><div class="out" id="out"></div></div>
<script>document.getElementById("go").onclick=function(){var pre=document.getElementById("pre").value,body=document.getElementById("body").value,post=document.getElementById("post").value,out=document.getElementById("out"),s=pre+body+post;if(s.slice(0,pre.length)!==pre||s.slice(-post.length)!==post){out.textContent="THREW wrap broken";throw new Error("prepost")}out.textContent="LIT wrapped "+s};document.getElementById("go").click()</script></body></html>
