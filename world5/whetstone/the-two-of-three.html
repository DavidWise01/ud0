<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE TWO OF THREE — a dart · SONNY 5</title>
<style>:root{--void:#0b1020;--line:rgba(62,240,255,.28);--ink:#cfe9ff;--dim:#6f8ba8;--cyan:#3ef0ff;--orange:#ff8a3d;--gold:#d9b45a;--good:#59ffb0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1020;color:var(--ink);max-width:900px;margin:auto;padding:20px}a{color:var(--cyan)}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}.dart{color:var(--orange);border:1px solid var(--orange);padding:2px 8px}h1{letter-spacing:2px;margin:16px 0}.panel{border:1px solid var(--line);padding:14px;margin:14px 0}input,button{background:#102030;color:var(--gold);border:1px solid var(--line);padding:7px 11px;width:70px}button{color:var(--cyan);cursor:pointer;width:auto}.out{margin-top:8px;color:var(--good)}</style></head>
<body><div class="top"><a href="./">◄ WHETSTONE BAY</a><span class="dart">WHET 06 / 42</span></div>
<h1>THE TWO OF THREE</h1>
<p style="color:var(--dim)">Three witnesses, two must agree. 1-1-1 is WALL.</p>
<div class="panel">A <input id="a" value="7"> B <input id="b" value="7"> C <input id="c" value="8"> <button id="go">VOTE</button><div class="out" id="out"></div></div>
<script>document.getElementById("go").onclick=function(){var a=document.getElementById("a").value,b=document.getElementById("b").value,c=document.getElementById("c").value,out=document.getElementById("out");if(a===b||a===c)out.textContent="LIT two-of-three agree on "+a;else if(b===c)out.textContent="LIT two-of-three agree on "+b;else{out.textContent="WALL split 1-1-1";throw new Error("no quorum")}};document.getElementById("go").click()</script></body></html>
