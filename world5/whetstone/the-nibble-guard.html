<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE NIBBLE GUARD — a dart · SONNY 5</title>
<style>:root{--line:rgba(62,240,255,.28);--ink:#cfe9ff;--dim:#6f8ba8;--cyan:#3ef0ff;--orange:#ff8a3d;--gold:#d9b45a;--good:#59ffb0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1020;color:var(--ink);max-width:900px;margin:auto;padding:20px}a{color:var(--cyan)}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}.dart{color:var(--orange);border:1px solid var(--orange);padding:2px 8px}h1{letter-spacing:2px;margin:16px 0}.panel{border:1px solid var(--line);padding:14px;margin:14px 0}input,button{background:#102030;color:var(--gold);border:1px solid var(--line);padding:7px 11px}button{color:var(--cyan);cursor:pointer}.out{margin-top:8px;color:var(--good)}</style></head>
<body><div class="top"><a href="./">◄ WHETSTONE BAY</a><span class="dart">WHET 09 / 42</span></div>
<h1>THE NIBBLE GUARD</h1>
<p style="color:var(--dim)">High nibble must equal low nibble XOR 0xF.</p>
<div class="panel">byte 0-255 <input id="v" value="165"> <button id="go">GUARD</button><div class="out" id="out"></div></div>
<script>document.getElementById("go").onclick=function(){var n=+document.getElementById("v").value,out=document.getElementById("out");if(n!==(n&255)||n<0){out.textContent="WALL 0..255";return}var hi=(n>>4)&15,lo=n&15;if(hi!==(lo^15)){out.textContent="THREW hi="+hi+" lo="+lo;throw new Error("nibble guard")}out.textContent="LIT hi="+hi+" lo="+lo+" xor15 holds"};document.getElementById("go").click()</script></body></html>
