<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE REPETITION THREE — a dart · SONNY 5</title>
<style>:root{--void:#0b1020;--line:rgba(62,240,255,.28);--ink:#cfe9ff;--dim:#6f8ba8;--cyan:#3ef0ff;--orange:#ff8a3d;--gold:#d9b45a;--good:#59ffb0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1020;color:var(--ink);max-width:900px;margin:auto;padding:20px}a{color:var(--cyan)}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}.dart{color:var(--orange);border:1px solid var(--orange);padding:2px 8px}h1{letter-spacing:2px;margin:16px 0}.panel{border:1px solid var(--line);padding:14px;margin:14px 0}input,button{background:#102030;color:var(--gold);border:1px solid var(--line);padding:7px 11px}button{color:var(--cyan);cursor:pointer}.out{margin-top:8px;color:var(--good)}</style></head>
<body><div class="top"><a href="./">◄ WHETSTONE BAY</a><span class="dart">WHET 05 / 42</span></div>
<h1>THE REPETITION THREE</h1>
<p style="color:var(--dim)">Send a bit three times. Majority recovers. I-13 AMBER.</p>
<div class="panel">triplet 0/1 <input id="v" value="1 1 0"> <button id="go">DECODE</button><div class="out" id="out"></div></div>
<div class="panel">SEAL <code>9dc6ad70926c2b5fb212cfcc86ffe3a839dd55973967182d2e1ad2fbe4b36349</code></div>
<script>document.getElementById("go").onclick=function(){var p=document.getElementById("v").value.trim().split(/\s+/).map(Number);var out=document.getElementById("out");if(p.length!==3||p.some(function(x){return x!==0&&x!==1})){out.textContent="WALL three bits 0/1";return}var s=p[0]+p[1]+p[2];if(s===0||s===3)out.textContent="LIT unanimous "+(s===3?1:0);else if(s===2)out.textContent="LIT majority 1 (one dissent)";else out.textContent="LIT majority 0 (one dissent)"};document.getElementById("go").click()</script></body></html>
