<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE EVEN PARITY — a dart · SONNY 5</title>
<style>:root{--void:#0b1020;--line:rgba(62,240,255,.28);--ink:#cfe9ff;--dim:#6f8ba8;--cyan:#3ef0ff;--orange:#ff8a3d;--gold:#d9b45a;--good:#59ffb0}*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1020;color:var(--ink);max-width:900px;margin:auto;padding:20px}a{color:var(--cyan)}.top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px}.dart{color:var(--orange);border:1px solid var(--orange);padding:2px 8px}h1{letter-spacing:2px;margin:16px 0}.panel{border:1px solid var(--line);padding:14px;margin:14px 0}input,button{background:#102030;color:var(--gold);border:1px solid var(--line);padding:7px 11px}button{color:var(--cyan);cursor:pointer}.out{margin-top:8px;color:var(--good)}</style></head>
<body><div class="top"><a href="./">< WORLD V WHETSTONE BAY</a><span class="dart">WHET 01 / 42</span></div>
<h1>THE EVEN PARITY</h1>
<p style="color:var(--dim)">XOR of bits must be 0. I-13 kinship AMBER.</p>
<div class="panel">bits <input id="v" value="1011001"> <button id="go">CHECK</button> <button id="tam">FLIP LSB</button><div class="out" id="out"></div></div>
<div class="panel">SEAL <code>cd7c03f1f151246fa0f1aa91ad46ae78a6cb4748261a93bc1d5686a9fd3d1fdc</code></div>
<script>function parity(s){var p=0;for(var i=0;i<s.length;i++){if(s[i]!=='0'&&s[i]!=='1')throw new Error('WALL bits only');p^=+s[i]}return p}
function run(expect){var s=document.getElementById('v').value.trim(),out=document.getElementById('out');try{if(parity(s)!==0){out.textContent='THREW odd parity';if(!expect)throw new Error('even parity failed');return}out.textContent='LIT even parity holds on '+s}catch(e){out.textContent=e.message;if(e.message==='even parity failed')throw e}}
document.getElementById('go').onclick=function(){run(false)};document.getElementById('tam').onclick=function(){var s=document.getElementById('v').value.trim();document.getElementById('v').value=s.slice(0,-1)+(s.slice(-1)==='0'?'1':'0');run(true)};run(false)</script></body></html>
