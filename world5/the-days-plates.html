<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE DAY'S PLATES · SONNY 5</title>
<style>
html,body{margin:0;height:100%;background:#0c0614;overflow:hidden;}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#0c0614;}
.hit{position:fixed;top:0;bottom:0;width:24%;border:0;background:transparent;cursor:pointer;z-index:2;}
#prev{left:0;}
#next{right:0;}
.n{position:fixed;z-index:3;bottom:12px;left:0;right:0;text-align:center;color:rgba(244,239,228,.8);font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;pointer-events:none;text-shadow:0 1px 6px #000;}
a.back{position:fixed;z-index:3;top:12px;left:14px;color:#f4efe4;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-decoration:none;text-shadow:0 1px 6px #000;}
.fail{display:none;position:fixed;z-index:5;left:12px;right:12px;top:12px;background:#ff6b8a;color:#1b0730;padding:10px 12px;font:700 14px ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="fail" id="failb"></div>
<a class="back" href="./">WORLD V</a>
<img id="plate" src="art/day/disc.jpg" alt="A disc held in a brass ring">
<button class="hit" id="prev" aria-label="previous artwork"></button>
<button class="hit" id="next" aria-label="next artwork"></button>
<div class="n" id="n">1 / 8</div>
<script>
"use strict";
(function(){
  function $(id){return document.getElementById(id);}
  try{
    var PLATES=[
      ["art/day/disc.jpg","A disc held in a brass ring"],
      ["art/day/speaker.jpg","A speaker whose ring of light has thinned to a crescent"],
      ["art/day/shutter.jpg","A sealed glass, the messages kept inside"],
      ["art/day/lattice.jpg","A chip of rings whose shadows disagree"],
      ["art/day/hydrogen.jpg","A lantern walker under a pale flame"],
      ["art/day/coast.jpg","A coastal city at night and one magenta road"],
      ["art/day/twofold.jpg","Two panes and a mask of light"],
      ["art/day/cube.jpg","A small cube and the empty place beside it"]
    ];
    function selfcheck(){
      var seen={},i,p;
      if(PLATES.length!==8)throw new Error("plates");
      if(PLATES[0][0]!=="art/day/disc.jpg")throw new Error("opener");
      for(i=0;i<PLATES.length;i++){
        p=PLATES[i][0];
        if(p.indexOf("art/day/")!==0||p.slice(-4)!==".jpg")throw new Error("path");
        if(seen[p])throw new Error("dup");
        seen[p]=1;
      }
    }
    var at=0;
    function show(){
      var p=PLATES[at];
      var img=$("plate");
      img.src=p[0];
      img.alt=p[1];
      $("n").textContent=(at+1)+" / "+PLATES.length;
      var nxt=new Image();
      nxt.src=PLATES[(at+1)%PLATES.length][0];
    }
    function step(d){at=(at+d+PLATES.length)%PLATES.length;show();}
    selfcheck();
    show();
    $("next").onclick=function(){step(1);};
    $("prev").onclick=function(){step(-1);};
    window.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")step(1);
      else if(e.key==="ArrowLeft")step(-1);
    });
  }catch(e){
    var fb=$("failb");
    if(fb){fb.style.display="block";fb.textContent="FAIL-LOUD — "+(e&&e.message?e.message:e);}
    throw e;
  }
})();
</script>
</body>
</html>
