<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drain — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#fff1f2;color:#4c0519;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#431407;color:#fff7ed;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#bowls{display:flex;gap:8px;flex-wrap:wrap;} .bowl{width:72px;height:72px;border:3px solid currentColor;border-radius:0 0 36px 36px;display:flex;align-items:flex-end;justify-content:center;font-size:24px;}
</style>
</head>
<body data-kind="sonny-drain">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-five-rules.html">the measured room</a></p>
<h1>The Drain</h1>
<p class="lede">Three scopes are open. Pull the drain once. The closers come out innermost first, and the stack is empty.</p>
<div id="stage"><div class="stamps"><b>LIT drain</b></div><div id="bowls"></div><div class="row" style="margin-top:10px"><button data-act="pull">Pull the drain</button><button data-act="reset">Open them again</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.value=146;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

function drain(open){ var out=[]; var s=open.slice(); while(s.length) out.push(s.pop()); return out; }
var open=["g","u","p"], pulled=false;
function draw(){
  var show=pulled?[]:open;
  document.getElementById("bowls").innerHTML=(show.length?show:["·"]).map(function(x){return '<div class="bowl">'+x+'</div>';}).join("");
  document.getElementById("note").textContent=pulled?"Closers: p then u then g. Stack empty.":"Three scopes open.";
}
function onAct(act){ if(act==="pull") pulled=true; if(act==="reset") pulled=false; draw(); }
function prove(){
  var d=drain(["g","u","p"]);
  if(d.join(",")!=="p,u,g") throw new Error("order");
  if(drain([]).length!==0) throw new Error("empty");
  document.getElementById("proof").textContent="LIT one pull emits p, u, g and leaves the stack empty.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Drain";
var SLUG="sonny-drain";
var BLURB="The drain emits exactly the outstanding closers in one pull, innermost first. Open g, u, p drains as p, u, g.";
var SEAL="6ce864d67a5b899399f76dd4413c55ab909dbe66ced75190a90505c5477c6f5b";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
