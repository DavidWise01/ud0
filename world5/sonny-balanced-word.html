<style>
html,body{margin:0;min-width:0;}
body{background:#fdf4ff;color:#581c87;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#431407;color:#fff7ed;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

#scale{margin-top:20px;} #beam{height:10px;background:#581c87;width:min(100%,360px);margin:0 auto;transform-origin:center;} .pans{display:flex;justify-content:space-between;width:min(100%,360px);margin:8px auto;} .pan{min-width:80px;border:2px solid currentColor;padding:8px;text-align:center;}

<body data-kind="sonny-balanced-word">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-conservation-law.html">the measured room</a></p>
<h1>The Balanced Word</h1>
<p class="lede">Drop tokens into the pans. The beam is level only when the bind count equals the release count.</p>
<div id="stage"><div class="stamps"><b>LIT scale</b><b>WALL compiler</b></div><div id="scale"><div id="beam"></div><div class="pans"><div class="pan" id="lb">B 0</div><div class="pan" id="rk">K 0</div></div></div><div class="row"><button data-act="B">Add bind</button><button data-act="K">Add release</button><button data-act="clear">Clear</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine";
  o.frequency.value=196;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var B=0, K=0;
function angle(){ return (K-B)*8; }
function draw(){
  document.getElementById("beam").style.transform="rotate("+angle()+"deg)";
  document.getElementById("lb").textContent="B "+B;
  document.getElementById("rk").textContent="K "+K;
  document.getElementById("note").textContent = B===K ? "Level." : "Tipped.";
}
function onAct(act){
  if(act==="B") B++;
  if(act==="K") K++;
  if(act==="clear"){ B=0; K=0; }
  draw();
}
function prove(){
  if((0-0)!==0) throw new Error("zero");
  if(!((2-2)===0) || (2-1)===0) throw new Error("pans");
  document.getElementById("proof").textContent="LIT the beam is level only when bind count equals release count. WALL compiler not run.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Balanced Word";
var SLUG="sonny-balanced-word";
var BLURB="Two pans. B sits on the left and K on the right. The beam levels when the counts match. This is the same toy as the tape, drawn as a scale.";
var SEAL="f34d45a5dd3e950e71f701dc29e40c533d436ba46ec4f944885722b6a9589044";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
