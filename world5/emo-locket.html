<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE EMPTY LOCKET · THE EMO HOUR</title>
<style>
html,body{margin:0;height:100%;background:#120814;overflow:hidden;}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#120814;}
a.hit{position:fixed;top:0;height:100%;width:22%;z-index:2;display:block;}
#prev{left:0;}
#next{right:0;}
.kicker{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;color:#f0d9a0;margin:0 0 8px;}
.story{position:fixed;z-index:3;left:0;top:0;bottom:0;width:min(34vw,420px);padding:18vh 22px 28px;background:linear-gradient(to right,rgba(28,6,20,.92),rgba(28,6,20,.4) 80%,rgba(28,6,20,0));color:#f8eef4;pointer-events:none;} .story p{margin:0;max-width:none;font:17px/1.45 "Segoe Script","Bradley Hand","Snell Roundhand","Apple Chancery",cursive;text-shadow:0 1px 2px #000;} @media(max-width:700px){.story{top:auto;width:auto;right:0;padding:28px 6vw 18px;background:linear-gradient(to top,rgba(20,6,16,.94),rgba(20,6,16,0));}}
a.back{position:fixed;z-index:4;top:12px;left:14px;color:#f8eef4;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-decoration:none;text-shadow:0 1px 6px #000;}
.fail{display:none;position:fixed;z-index:5;left:12px;right:12px;top:36px;background:#ff6b8a;color:#1b0730;padding:10px 12px;font:700 14px ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="fail" id="failb"></div>
<a class="back" href="./">WORLD V</a>
<img id="plate" src="art/emo/locket.jpg" alt="An open heart locket with both windows empty">
<a class="hit" id="prev" href="emo-underpass.html" aria-label="previous page"></a>
<a class="hit" id="next" href="emo-studs.html" aria-label="next page"></a>
<div class="story">
  <div class="kicker">12 / 27 &middot; THE EMPTY LOCKET</div>
  <p>Open, and both little windows refused a face. The chain is tired of being a circle. I left the photographs out. A face would have made a promise.</p>
</div>
<script>
"use strict";
(function(){
  function $(id){return document.getElementById(id);}
  try{
    var STEP=12;
    var TOTAL=27;
    var PLATE="art/emo/locket.jpg";
    var PREV="emo-underpass.html";
    var NEXT="emo-studs.html";
    function selfcheck(){
      if(TOTAL!==27||STEP<1||STEP>TOTAL)throw new Error("step");
      if(PLATE.indexOf("art/emo/")!==0||PLATE.slice(-4)!==".jpg")throw new Error("plate");
      if($("plate").getAttribute("src")!==PLATE)throw new Error("src");
      if($("prev").getAttribute("href")!==PREV)throw new Error("prev");
      if($("next").getAttribute("href")!==NEXT)throw new Error("next");
      var kick=document.querySelector(".kicker").textContent;
      if(kick.indexOf(STEP+" / "+TOTAL)!==0)throw new Error("kicker");
    }
    selfcheck();
    window.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")location.href=NEXT;
      else if(e.key==="ArrowLeft")location.href=PREV;
    });
  }catch(e){
    var fb=$("failb");
    if(fb){fb.style.display="block";fb.textContent="FAIL-LOUD — "+(e&&e.message?e.message:e);}
    throw e;
  }
})();
</script>
</body>
</html>
