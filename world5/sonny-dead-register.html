<style>
html,body{margin:0;min-width:0;}
body{background:#7f1d1d;color:#fef2f2;font-family:Georgia,"Iowan Old Style",Palatino,serif;}

a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}

button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#fff7ed;color:#431407;}

<body data-kind="sonny-dead-register">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-five-rules.html">the measured room</a></p>
<h1>The Dead Register</h1>
<p class="lede">Fire the two dead rules. The try counter moves. The work result stays empty, and the address sensor stays 0.</p>
<div id="stage"><div class="stamps"><b>DEAD idempotence</b><b>DEAD address</b></div><div class="machine"><div class="plate">Idempotence<strong id="work">0</strong>tries <span id="tries">0</span></div><div class="plate">Address<strong id="sensor">0</strong>sensor stays</div></div><button data-act="fire">Try to fire both</button></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=73;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var LAST=null, RUN=null, tries=0;
function idempotenceWork(){ tries++; if(LAST===null) return 0; return 1; }
function addressSensor(){ return RUN===null ? 0 : RUN; }
function draw(){
  document.getElementById("work").textContent=String(idempotenceWork());
  tries--;
  document.getElementById("tries").textContent=String(tries);
  document.getElementById("sensor").textContent=String(addressSensor());
}
function onAct(){ tries++; draw(); document.getElementById("note").textContent="The counter moved. The rules did no work."; }
function prove(){
  var before=tries;
  for(var i=0;i<5;i++){ if(idempotenceWork()!==0) throw new Error("idempotence fired"); }
  if(addressSensor()!==0) throw new Error("address");
  if(LAST!==null || RUN!==null) throw new Error("assigned");
  tries=before;
  document.getElementById("proof").textContent="LIT idempotence does no work because last is unset. Address reads 0. DEAD both.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Dead Register";
var SLUG="sonny-dead-register";
var BLURB="The dead register. Idempotence compares against a last value that is never set, so it does no work. Address reads a constant 0.";
var SEAL="f190ee5375de92bf1422923fbb80764fecf7e3c17dc547a2a1c536bfb42abedb";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
