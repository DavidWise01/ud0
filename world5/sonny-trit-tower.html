<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trit Tower — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#78350f;color:#fffbeb;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#fff7ed;color:#431407;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#tower{display:flex;align-items:flex-end;gap:8px;min-height:160px;margin:12px 0;} .crystal{background:#fbbf24;color:#451a03;display:flex;align-items:flex-end;justify-content:center;clip-path:polygon(50% 0,100% 100%,0 100%);}
</style>
</head>
<body data-kind="sonny-trit-tower">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-cubi.html">the measured room</a></p>
<h1>The Trit Tower</h1>
<p class="lede">Stack the crystals in order. A crystal out of order does not land. The cubi room is the citation for the name VH1.</p>
<div id="stage"><div class="stamps"><b>LIT product</b><b>AMBER VH1 name</b></div><div id="tower"></div><div class="row"><button data-act="put" data-arg="1">1</button><button data-act="put" data-arg="3">3</button><button data-act="put" data-arg="9">9</button><button data-act="put" data-arg="27">27</button><button data-act="put" data-arg="81">81</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.value=294;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var powers=[1,3,9,27,81];
var stacked=[];
function draw(){
  document.getElementById("tower").innerHTML=stacked.map(function(n){
    return '<div class="crystal" style="height:'+(40+n)+'px;width:54px">'+n+'</div>';
  }).join("");
  document.getElementById("note").textContent=stacked.length?stacked.join(" · "):"Empty plinth.";
}
function onAct(act, arg){
  var n=+arg;
  if(act!=="put") return;
  if(powers[stacked.length]!==n){ document.getElementById("note").textContent=n+" is out of order."; return; }
  stacked.push(n); draw();
}
function prove(){
  var x=1;
  for(var i=0;i<5;i++){ if(powers[i]!==x) throw new Error("power"); x*=3; }
  if(powers.join(",")!=="1,3,9,27,81") throw new Error("list");
  document.getElementById("proof").textContent="LIT the page multiplies 1, 3, 9, 27, 81. AMBER the VH1 name is cited from the cubi room.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Trit Tower";
var SLUG="sonny-trit-tower";
var BLURB="Five crystals, 1, 3, 9, 27, 81. Each is triple the one under it. The page only multiplies. The VH1 name is cited from the cubi room.";
var SEAL="5badbb6904eaf3f7de132c5ba07817ae78df0be9382edcde237aafaa4a40fc42";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
