<head>
<meta charset="utf-8">

<title>The Underflow — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#450a0a;color:#fee2e2;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}

button,a.door{font:inherit;}

button.on{background:#fff7ed;color:#431407;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

.tape{font-family:ui-monospace,Consolas,monospace;font-size:22px;padding:12px;border:2px solid currentColor;margin:8px 0;} .bad{background:#7f1d1d;} .good{background:#14532d;color:#ecfdf5;}
</style>

<body data-kind="sonny-underflow">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-conservation-law.html">the measured room</a></p>
<h1>The Underflow</h1>
<p class="lede">The broken tape is Const, Bin. Insert the missing Const and the stack can fall back to zero.</p>
<div id="stage"><div class="stamps"><b>LIT repair</b></div><div id="shown" class="tape"></div><button data-act="fix">Insert the missing Const</button></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=110;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var OPS={"Const":[0,1],"Ask":[0,1],"Attr":[1,1],"Ret":[1,1],"Answer":[1,0],"Drop":[1,0],"Bin":[2,1],"Cmp":[2,1],"If":[1,0],"Block":[0,0],"Else":[0,0],"End":[0,0],"Func":[0,0],"Halt":[0,0]};

function opNet(op){ var t=OPS[op]; return t[1]-t[0]; }
function callNet(n, tamper){ return 1 - (tamper ? n : n+1); }
function run(code, tamper){
  var h=0, slots=0, ctrl=[], ok=true, reason="";
  for(var i=0;i<code.length;i++){
    slots++;
    var ins=code[i];
    var k = ins.op==="Call" ? (tamper?ins.n:ins.n+1) : OPS[ins.op][0];
    var net = ins.op==="Call" ? callNet(ins.n, tamper) : opNet(ins.op);
    if(h-k<0){ ok=false; if(!reason) reason="underflow"; }
    if(ins.op==="Block") ctrl.push(h);
    else if(ins.op==="End"){ if(!ctrl.length){ ok=false; reason=reason||"no region"; } else ctrl.pop(); }
    h+=net;
  }
  if(ctrl.length){ ok=false; reason=reason||"unclosed"; }
  var valid=ok && h===0;
  return {valid:valid, height:h, slots:slots, reason:valid?"balanced":(reason||("height "+h))};
}

var fixed=false;
function draw(){
  document.getElementById("shown").textContent = fixed ? "Const   Const   Bin   Answer" : "Const   Bin";
  document.getElementById("shown").className = "tape "+(fixed?"good":"bad");
  var code = fixed ? [{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"}] : [{op:"Const"},{op:"Bin"}];
  var r=run(code,false);
  document.getElementById("note").textContent=r.valid?"The repair balances.":("Broken: "+r.reason);
}
function onAct(act){ if(act==="fix") fixed=!fixed; draw(); }
function prove(){
  var bad=run([{op:"Const"},{op:"Bin"}], false);
  var good=run([{op:"Const"},{op:"Const"},{op:"Bin"},{op:"Answer"}], false);
  if(bad.valid) throw new Error("should underflow");
  if(!good.valid || good.height!==0) throw new Error("repair");
  document.getElementById("proof").textContent="LIT Const Bin underflows. Const Const Bin Answer balances.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Underflow";
var SLUG="sonny-underflow";
var BLURB="A Bin with one operand underflows. Inserting the missing Const makes Const, Const, Bin, Answer balance.";
var SEAL="b40c945e9b927a8d89ec324ebd07b5db16eb490a294394b0715c44c9307d4520";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
