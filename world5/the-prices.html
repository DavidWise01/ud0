<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE PRICES · THE DAY'S STORY</title>
<style>
html,body{margin:0;height:100%;background:#0c0614;overflow:hidden;}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#0c0614;}
a.hit{position:fixed;top:0;height:100%;width:22%;z-index:2;display:block;}
#prev{left:0;}
#next{right:0;}
.kicker{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;color:#7a4b12;margin:0 0 8px;}
.story{position:fixed;z-index:3;left:4vw;bottom:4vh;width:min(34rem,88vw);padding:16px 18px 14px;background:rgba(244,239,228,.93);color:#1b0730;pointer-events:none;} .kicker{color:#7a4b12 !important;} .story p{margin:0;max-width:none;font:17px/1.45 Candara,"Segoe UI",sans-serif,serif;color:#1b0730;text-shadow:none;}
a.back{position:fixed;z-index:4;top:12px;left:14px;color:#f4efe4;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-decoration:none;text-shadow:0 1px 6px #000;}
.fail{display:none;position:fixed;z-index:5;left:12px;right:12px;top:36px;background:#ff6b8a;color:#1b0730;padding:10px 12px;font:700 14px ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="fail" id="failb"></div>
<a class="back" href="./">WORLD V</a>
<img id="plate" src="art/story/prices.jpg" alt="A dawn market with blank slips and one empty cloth">
<a class="hit" id="prev" href="the-wire.html" aria-label="previous page"></a>
<a class="hit" id="next" href="the-open-disc.html" aria-label="next page"></a>
<div class="story">
  <div class="kicker">2 / 27 &middot; THE PRICES</div>
  <p>Dawn market. The cabbages are real. The slips on the boards are blank, because the numbers were never the produce. One square of cloth stays empty, which is where a second crate was promised and did not come. I take the cabbage. I leave the promise.</p>
</div>
<script>
"use strict";
(function(){
  function $(id){return document.getElementById(id);}
  try{
    var STEP=2;
    var TOTAL=27;
    var PLATE="art/story/prices.jpg";
    var PREV="the-wire.html";
    var NEXT="the-open-disc.html";
    function selfcheck(){
      if(TOTAL!==27||STEP<1||STEP>TOTAL)throw new Error("step");
      if(PLATE.indexOf("art/story/")!==0||PLATE.slice(-4)!==".jpg")throw new Error("plate");
      if($("plate").getAttribute("src")!==PLATE)throw new Error("src");
      if($("prev").getAttribute("href")!==PREV)throw new Error("prev");
      if($("next").getAttribute("href")!==NEXT)throw new Error("next");
      var kick=document.querySelector(".kicker").textContent;
      if(kick.indexOf(STEP+" / "+TOTAL)!==0)throw new Error("kicker");
    }
    selfcheck();
    window.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")location.href=NEXT;
      else if(e.key==="ArrowLeft")location.href=PREV;
    });
  }catch(e){
    var fb=$("failb");
    if(fb){fb.style.display="block";fb.textContent="FAIL-LOUD — "+(e&&e.message?e.message:e);}
    throw e;
  }
})();
</script>
</body>
</html>
