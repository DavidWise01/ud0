<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rejected Rank — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#fef9c3;color:#422006;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#431407;color:#fff7ed;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#shelf{display:flex;gap:8px;align-items:flex-end;border-bottom:8px solid currentColor;min-height:90px;max-width:220px;} .block{width:64px;height:64px;background:#b45309;color:#fffbeb;display:flex;align-items:center;justify-content:center;font-size:24px;} .fallen{margin-top:18px;opacity:.7;}
</style>
</head>
<body data-kind="sonny-rejected-rank">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-cubi.html">the measured room</a></p>
<h1>The Rejected Rank</h1>
<p class="lede">Place the blocks. The third falls off a shelf of width 2. AMBER: the cubi room holds the real rejection. This page checks 3 greater than 2.</p>
<div id="stage"><div class="stamps"><b>LIT 3 &gt; 2</b><b>AMBER cubi</b><b>WALL stabilizers</b></div><div id="shelf"></div><div id="floor"></div><div class="row"><button data-act="place">Place a block</button><button data-act="reset">Clear the shelf</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="square";
  o.frequency.value=130;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

var placed=0;
function fits(blocks, rank){ return blocks<=rank; }
function draw(){
  var html="";
  for(var i=0;i<Math.min(placed,2);i++) html+='<div class="block">'+(i+1)+'</div>';
  document.getElementById("shelf").innerHTML=html;
  document.getElementById("floor").innerHTML = placed>2 ? '<div class="block fallen">3</div>' : '';
  document.getElementById("note").textContent = placed>2 ? "The third block fell. Rank 2 cannot hold 3." : ("On the shelf: "+Math.min(placed,2));
}
function onAct(act){
  if(act==="place") placed=Math.min(3, placed+1);
  if(act==="reset") placed=0;
  draw();
}
function prove(){
  if(fits(3,2)) throw new Error("should not fit");
  if(!fits(2,2)) throw new Error("pair should fit");
  document.getElementById("proof").textContent="LIT 3 does not fit in rank 2. AMBER the cubi rejection is cited. WALL stabilizers were not rerun.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Rejected Rank";
var SLUG="sonny-rejected-rank";
var BLURB="A toy shelf of rank 2. Three blocks do not fit. This illustrates the rejected rank claim cited from the cubi room. The stabilizer proof is not rerun here.";
var SEAL="1c65fb4f891318699a87756bc0ebdf24b46dd9308fb2dd7a2dc1d87e05d64d2f";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
