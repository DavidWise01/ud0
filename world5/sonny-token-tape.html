<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Token Tape — WORLD V</title>
<style>
html,body{margin:0;min-width:0;}
body{background:#701a75;color:#fdf4ff;font-family:Georgia,"Iowan Old Style",Palatino,serif;}
#wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;min-width:0;}
a{color:inherit;}
.kicker{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;}
h1{font-size:clamp(32px,6vw,64px);line-height:.95;margin:0 0 10px;font-weight:700;}
.lede,.kicker,h1,#proof,#note,button,a,p,li{min-width:0;overflow-wrap:anywhere;}
.lede{font-size:18px;max-width:62ch;margin:0 0 18px;}
#stage{min-width:0;}
button,a.door{font:inherit;}
button{cursor:pointer;border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;}
button.on{background:#fff7ed;color:#431407;}
#proof{font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:18px;padding:10px 12px;border:2px solid currentColor;border-radius:12px;}
#note{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:1.2em;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.08em;}
.stamps b{border:1px solid currentColor;border-radius:999px;padding:2px 8px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

#tape{font-family:ui-monospace,Consolas,monospace;font-size:28px;letter-spacing:.2em;min-height:1.3em;}
</style>
</head>
<body data-kind="sonny-token-tape">
<div id="wrap">
<p class="kicker"><a href="./">World V</a> · <a href="sonny-atrium.html">Atrium</a> · <a href="the-conservation-law.html">the measured room</a></p>
<h1>The Token Tape</h1>
<p class="lede">Lay B and K. Net is binds minus releases. BBKK balances. WALL: the I-13 compiler was not run.</p>
<div id="stage"><div class="stamps"><b>LIT toy</b><b>WALL compiler</b></div><p id="tape"></p><div class="row"><button data-act="B">B bind</button><button data-act="K">K release</button><button data-act="bbkk">Lay BBKK</button><button data-act="bbk">Lay BBK</button><button data-act="clear">Clear</button></div></div>
<p id="proof">checking</p>
<p id="note"></p>
</div>
<script id="sonny-proof">

var audioCtx=null;
function tone(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="triangle";
  o.frequency.value=246;
  g.gain.value=0.05;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.16);
}
document.addEventListener("pointerdown", function(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }, {once:false});

function netOf(word){ var n=0; for(var i=0;i<word.length;i++){ if(word[i]==="B") n++; else if(word[i]==="K") n--; else throw new Error("tok"); } return n; }
var word="";
function draw(){
  document.getElementById("tape").textContent=word||"·";
  document.getElementById("note").textContent="net "+(word?netOf(word):0);
}
function onAct(act){
  if(act==="B"||act==="K") word+=act;
  if(act==="bbkk") word="BBKK";
  if(act==="bbk") word="BBK";
  if(act==="clear") word="";
  draw();
}
function prove(){
  if(netOf("BBKK")!==0) throw new Error("balance");
  if(netOf("BBK")!==1) throw new Error("short");
  document.getElementById("proof").textContent="LIT BBKK nets 0 and BBK nets 1. WALL the compiler was not run.";
}
prove(); draw();

document.getElementById("stage").addEventListener("click", function(ev){
  var b=ev.target.closest("button");
  if(!b) return;
  tone();
  onAct(b.getAttribute("data-act"), b.getAttribute("data-arg"));
});



var NAME="The Token Tape";
var SLUG="sonny-token-tape";
var BLURB="A tape of B and K. B adds one bind and K adds one release. BBKK ends at net zero. BBK does not. The compiler is not run.";
var SEAL="98009ffd4f31e56ae0ed051c1bb1b1d0db63e38338fe9f28b083ed4ba802ad5c";
if (window.crypto && crypto.subtle) {
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(NAME+"|"+SLUG+"|"+BLURB)).then(function(buf){
    var hex="";
    var bytes=new Uint8Array(buf);
    for (var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,"0");
    if (hex!==SEAL) { document.getElementById("proof").textContent="FAIL seal"; throw new Error("seal mismatch"); }
  });
}
window.__sonny={prove:prove, slug:SLUG};

</script>
</body>
</html>
