<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE EITHER SIDE · THE DAY'S STORY</title>
<style>
html,body{margin:0;height:100%;background:#0c0614;overflow:hidden;}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#0c0614;}
a.hit{position:fixed;top:0;height:100%;width:22%;z-index:2;display:block;}
#prev{left:0;}
#next{right:0;}
.kicker{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;color:#f2e7c4;margin:0 0 8px;}
.story{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:22px 8vw 28px;background:linear-gradient(to top,rgba(12,6,20,.72),rgba(12,6,20,0));color:#f4efe4;pointer-events:none;text-align:center;} .story p{margin:0 auto;max-width:36rem;font:20px/1.4 ui-monospace,Menlo,Consolas,monospace,serif;text-shadow:0 1px 2px #000;}
a.back{position:fixed;z-index:4;top:12px;left:14px;color:#f4efe4;font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-decoration:none;text-shadow:0 1px 6px #000;}
.fail{display:none;position:fixed;z-index:5;left:12px;right:12px;top:36px;background:#ff6b8a;color:#1b0730;padding:10px 12px;font:700 14px ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="fail" id="failb"></div>
<a class="back" href="./">WORLD V</a>
<img id="plate" src="art/story/either.jpg" alt="Two pale discs divided by a gold line">
<a class="hit" id="prev" href="the-unmeasured.html" aria-label="previous page"></a>
<a class="hit" id="next" href="the-three-threes.html" aria-label="next page"></a>
<div class="story">
  <div class="kicker">25 / 27 &middot; THE EITHER SIDE</div>
  <p>Left of the gold line, the disc sits low. Right of it, the disc has traveled. The screen works the same way. Left goes back. Right goes forward. If the counter lies, the page blushes red and stops being polite.</p>
</div>
<script>
"use strict";
(function(){
  function $(id){return document.getElementById(id);}
  try{
    var STEP=25;
    var TOTAL=27;
    var PLATE="art/story/either.jpg";
    var PREV="the-unmeasured.html";
    var NEXT="the-three-threes.html";
    function selfcheck(){
      if(TOTAL!==27||STEP<1||STEP>TOTAL)throw new Error("step");
      if(PLATE.indexOf("art/story/")!==0||PLATE.slice(-4)!==".jpg")throw new Error("plate");
      if($("plate").getAttribute("src")!==PLATE)throw new Error("src");
      if($("prev").getAttribute("href")!==PREV)throw new Error("prev");
      if($("next").getAttribute("href")!==NEXT)throw new Error("next");
      var kick=document.querySelector(".kicker").textContent;
      if(kick.indexOf(STEP+" / "+TOTAL)!==0)throw new Error("kicker");
    }
    selfcheck();
    window.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")location.href=NEXT;
      else if(e.key==="ArrowLeft")location.href=PREV;
    });
  }catch(e){
    var fb=$("failb");
    if(fb){fb.style.display="block";fb.textContent="FAIL-LOUD — "+(e&&e.message?e.message:e);}
    throw e;
  }
})();
</script>
</body>
</html>
